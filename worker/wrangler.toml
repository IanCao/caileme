name = "caileme-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "caileme-db"
database_id = "YOUR_DATABASE_ID_HERE"  # 部署时替换：wrangler d1 create caileme-db

# R2 图片存储（可选，用于图片上传功能）
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "caileme-uploads"

# 管理密钥（可选，用于后台管理接口）
# [vars]
# ADMIN_KEY = "YOUR_ADMIN_KEY_HERE"
